name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  python-test:
    name: Python Agent Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-core/requirements.txt
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov
      - name: Run tests with mock LLM
        env:
          MOCK_LLM: "true"
          CHROMA_HOST: localhost
          CHROMA_PORT: "8001"
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: agent-core/coverage.xml
          flags: python
          fail_ci_if_error: false

  java-build:
    name: Java Ticket Service Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ticket-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: Build and run unit tests
        run: mvn clean test -B
      - name: Verify build artifact
        run: mvn package -DskipTests -B -q

  compose-validate:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose configuration
        run: docker compose config --quiet
