server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: ticket-service
  jackson:
    default-property-inclusion: NON_NULL

agent:
  core:
    url: ${AGENT_CORE_URL:http://agent-core:8000}
    timeout-seconds: 60

security:
  user:
    name: ${APP_USERNAME:user}
    password: ${APP_PASSWORD:password}

logging:
  level:
    com.enterprise: DEBUG
    org.springframework.security: WARN
    org.springframework.web: INFO
